[pytest]
# Fixed 2 xdist workers (deterministic, not reliant on the agent passing -n). loadgroup pins every
# test tagged with the same `pytest.mark.xdist_group(...)` name to one worker — test_notifin_groups.py
# and test_notifin_fase3.py both rely on this (each module shares session-scoped fixtures — owner,
# group_ctx, etc. — across its own classes; loadgroup is what actually keeps that state on one worker).
# 2026-09-19: this was `--dist loadscope` before, which only pins by class/module and silently ignores
# xdist_group — that split those classes across workers, each with its own copy of the "shared" session
# fixtures, causing ~6-7/53 tests to fail nondeterministically depending on how the split landed. Since
# every module here already carries an xdist_group mark, loadgroup is a strict superset of loadscope's
# guarantees for this suite (plain, unmarked modules still just get their own group), not a behavior
# change for anything that was passing reliably.
# AGENT: do NOT modify addopts beyond what's needed to keep this suite deterministic.
# Serial = `-n 0` (NOT `-p no:xdist`, which errors because addopts still passes -n/--dist). A custom `-n`
# option in your own pytest setup collides with xdist's -n — rename it.
required_plugins = pytest-xdist
addopts = -n 2 --dist loadgroup
